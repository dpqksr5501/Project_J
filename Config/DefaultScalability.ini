; Project J outdoor coverage: lower presets thin ground cover rather than
; removing it completely. Tree instances opt out of density scaling separately.
[FoliageQuality@0]
grass.DensityScale=0.2
foliage.DensityScale=0.35

[FoliageQuality@1]
grass.DensityScale=0.65
foliage.DensityScale=0.65

[FoliageQuality@2]
grass.DensityScale=1.0
foliage.DensityScale=1.0

[FoliageQuality@3]
grass.DensityScale=1.0
foliage.DensityScale=1.0

[FoliageQuality@Cine]
grass.DensityScale=1.0
foliage.DensityScale=1.0

; The imported outdoor palette exceeds the engine's small default pools.
; Keep tiered budgets and respect the platform VRAM limit.
[TextureQuality@0]
r.Streaming.PoolSize=768
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@1]
r.Streaming.PoolSize=1536
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@2]
r.Streaming.PoolSize=2048
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=2560
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@Cine]
r.Streaming.PoolSize=3072
r.Streaming.LimitPoolSizeToVRAM=1

; Project J crowd scalability policy:
; Low (@0) and Medium (@1) shed Lumen GI, Virtual Shadow Map page/SMRT budgets,
; and remote cloth simulation to protect client frame time and memory in dense
; combat crowds. Skeletal mesh raytracing/MeshCard updates remain off across
; MMO runtime tiers (@0-@3) to prevent per-frame BLAS/SkinCache collapse in
; 50-100+ character encounters, while explicit @2/@3/@Cine entries ensure
; switching quality back up restores every overridden CVar cleanly.
[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0
r.RayTracing.Scene.BuildMode=0
r.RayTracing.Geometry.SkeletalMeshes=0
r.MeshCardRepresentation.SkeletalMesh=0

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=0
r.RayTracing.Scene.BuildMode=0
r.RayTracing.Geometry.SkeletalMeshes=0
r.MeshCardRepresentation.SkeletalMesh=0

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.RayTracing.Scene.BuildMode=1
r.RayTracing.Geometry.SkeletalMeshes=0
r.MeshCardRepresentation.SkeletalMesh=0

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.RayTracing.Scene.BuildMode=1
r.RayTracing.Geometry.SkeletalMeshes=0
r.MeshCardRepresentation.SkeletalMesh=0

[GlobalIlluminationQuality@Cine]
r.Lumen.DiffuseIndirect.Allow=1
r.RayTracing.Scene.BuildMode=1
r.RayTracing.Geometry.SkeletalMeshes=1
r.MeshCardRepresentation.SkeletalMesh=1

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1

[ReflectionQuality@Cine]
r.Lumen.Reflections.Allow=1

[ShadowQuality@0]
r.Shadow.Virtual.MaxPhysicalPages=256
r.Shadow.Virtual.ResolutionLodBiasDirectional=2.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=2.0
r.Shadow.Virtual.ResolutionLodBiasLocal=2.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=3.0
r.Shadow.Virtual.SMRT.RayCountDirectional=1
r.Shadow.Virtual.SMRT.RayCountLocal=1

[ShadowQuality@1]
r.Shadow.Virtual.MaxPhysicalPages=512
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=2.0
r.Shadow.Virtual.SMRT.RayCountDirectional=2
r.Shadow.Virtual.SMRT.RayCountLocal=2

[ShadowQuality@2]
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.0
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=1.0
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=4

[ShadowQuality@3]
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=0.0
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.RayCountLocal=8

[ShadowQuality@Cine]
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=-0.5
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=-0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.RayCountLocal=8

; Remote cloth simulation scales down on Low/Medium; the local player remains
; outside ProjectJ.ClothBudget.MaxFullRemoteParts and keeps full cloth quality.
[EffectsQuality@0]
ProjectJ.ClothBudget.MaxFullRemoteParts=0
ProjectJ.ClothBudget.PauseOptInRemote=1
ProjectJ.Combat.Presentation.OtherPlayerOpacityScale=0.0
ProjectJ.Combat.Presentation.OtherPlayerOptionalEffects=0

[EffectsQuality@1]
ProjectJ.ClothBudget.MaxFullRemoteParts=2
ProjectJ.ClothBudget.PauseOptInRemote=0
ProjectJ.Combat.Presentation.OtherPlayerOpacityScale=0.35
ProjectJ.Combat.Presentation.OtherPlayerOptionalEffects=0

[EffectsQuality@2]
