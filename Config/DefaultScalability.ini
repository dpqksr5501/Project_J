ProjectJ.ClothBudget.PauseOptInRemote=0
ProjectJ.Combat.Presentation.OtherPlayerOpacityScale=0.65
ProjectJ.Combat.Presentation.OtherPlayerOptionalEffects=1

[EffectsQuality@3]
