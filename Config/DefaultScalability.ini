; Project J outdoor coverage: lower presets thin ground cover rather than
; removing it completely. Tree instances opt out of density scaling separately.
[FoliageQuality@0]
grass.DensityScale=0.2
foliage.DensityScale=0.35

[FoliageQuality@1]
grass.DensityScale=0.65
foliage.DensityScale=0.65

; The imported outdoor palette exceeds the engine's small default pools.
; Keep tiered budgets and respect the platform VRAM limit.
[TextureQuality@0]
r.Streaming.PoolSize=768
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@1]
r.Streaming.PoolSize=1536
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@2]
r.Streaming.PoolSize=2048
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=2560
r.Streaming.LimitPoolSizeToVRAM=1
