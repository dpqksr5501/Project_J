; UE 5.8 Dedicated Server runtime overrides (loaded by ConfigContext.cpp when IsRunningDedicatedServer() == true).
; Applies to both packaged Project_JServer targets and local `UnrealEditor-Cmd -server` dedicated instances.

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=30
MaxInternetClientRate=100000
MaxClientRate=100000
InitialConnectTimeout=30.0
ConnectionTimeout=30.0

[/Script/Project_J.Project_JIpNetDriver]
NetServerMaxTickRate=30
MaxInternetClientRate=100000
MaxClientRate=100000
InitialConnectTimeout=30.0
ConnectionTimeout=30.0

[DDoSDetection]
bDDoSDetection=True
bDDoSAnalytics=False
HitchTimeQuotaMS=30
HitchFrameTolerance=3

[SystemSettings]
; Dedicated servers skip client visual/rendering pipelines and keep CPU focused on 30Hz simulation.
net.Iris.UseIrisReplication=1
net.SubObjects.DefaultUseSubObjectReplicationList=1
net.MaxRPCPerNetUpdate=32
r.PSOPrecaching=0
r.ShaderPipelineCache.Enabled=0
a.Budget.Enabled=0
a.ParallelAnimEvaluation=1
a.ParallelAnimUpdate=1
tick.AllowBatchedTicks=1
tick.AllowAsyncComponentTicks=1
; Async tick dispatch/cleanup remain off by default based on 24-player controlled A/B; enable via CLI for 100+ profiling.
tick.AllowAsyncTickDispatch=0
tick.AllowAsyncTickCleanup=0
DDCvar.FootPlacementMode=0
gc.AllowParallelGC=1
gc.IncrementalBeginDestroyEnabled=1
gc.TimeBetweenPurgingPendingKillObjects=60
wp.Runtime.BlockOnSlowStreaming=0
