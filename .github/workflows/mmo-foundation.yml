name: MMO foundation contracts

on:
  pull_request:
    paths:
      - 'Source/**'
      - 'Config/**'
      - 'Infra/**'
      - 'Content/**'
      - 'Plugins/**'
      - 'Scripts/**'
      - 'Docs/**'
      - 'Project_J.uproject'
      - '.github/workflows/mmo-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Config/**'
      - 'Infra/**'
      - 'Content/**'
      - 'Plugins/**'
      - 'Scripts/**'
      - 'Docs/**'
      - 'Project_J.uproject'
      - '.github/workflows/mmo-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Module and MMO contract validation
        run: python Scripts/Validation/Validate-MMOArchitecture.py
      - name: Existing tool regressions
        run: python -m unittest discover -s Scripts/Tests -p "test_*.py"
      - name: Backend migrations and transactional regressions
        shell: pwsh
        run: |
          node --check Infra/nakama/modules/project_j_mmo.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/mmo-db-test" --ignore-scripts --no-audit --no-fund "@electric-sql/pglite@0.3.10"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node Infra/scripts/check-mmo-commands.mjs "$env:RUNNER_TEMP/mmo-db-test/node_modules/@electric-sql/pglite/dist/index.js" "$env:RUNNER_TEMP/mmo-db-test/data"
      - name: Documentation links
        shell: pwsh
        run: |
          node --test Scripts/Validation/Validate-DocLinks.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node Scripts/Validation/Validate-DocLinks.mjs
