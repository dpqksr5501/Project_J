# Project J Local MMO Backend & Observability Stack (100% Free Open-Source)
# Core stack:  docker compose -f Infra/docker-compose.yml up -d
# With Grafana/Prometheus: docker compose -f Infra/docker-compose.yml --profile observability up -d
# Reset: powershell -ExecutionPolicy Bypass -File Infra/scripts/dev-reset.ps1

services:
  postgres:
    image: postgres:16-alpine
    container_name: project_j_postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: project_j
      POSTGRES_USER: project_j
      POSTGRES_PASSWORD: project_j_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - project_j_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_j -d project_j"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: project_j_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: project_j
      DB_PASSWORD: project_j_dev_password
      DB_NAME: project_j
      LISTEN_PORT: 5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 40
      MAX_PREPARED_STATEMENTS: 200
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${DB_PASSWORD} psql -h 127.0.0.1 -p 5432 -U project_j -d project_j -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: project_j_valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.25.0
    container_name: project_j_nakama
    environment:
      PROJECT_J_NAKAMA_HTTP_KEY: "${PROJECT_J_NAKAMA_HTTP_KEY:?Set the local Nakama runtime key before starting this stack}"
      PROJECT_J_VALKEY_ADDR: "valkey:6379"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up --database.address project_j:project_j_dev_password@postgres:5432/project_j &&
        exec /nakama/nakama --name project_j_nakama --database.address project_j:project_j_dev_password@pgbouncer:5432/project_j
        --logger.level INFO --session.token_expiry_sec 7200 --runtime.js_entrypoint "project_j_mmo.js"
        --runtime.http_key "$${PROJECT_J_NAKAMA_HTTP_KEY}" --metrics.prometheus_port 9101
    ports:
      - "127.0.0.1:7349:7349" # gRPC
      - "127.0.0.1:7350:7350" # HTTP / WebSocket API
      - "127.0.0.1:7351:7351" # Nakama Admin Console
      - "127.0.0.1:9101:9101" # Nakama Prometheus metrics
    volumes:
      - ./nakama/modules:/nakama/data/modules:ro
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: project_j_pg_exporter
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://project_j:project_j_dev_password@postgres:5432/project_j?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"

  valkey_exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: project_j_valkey_exporter
    profiles: ["observability"]
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://valkey:6379"
    ports:
      - "127.0.0.1:9121:9121"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: project_j_prometheus
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - project_j_promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: project_j_grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: project_j_dev_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - project_j_grafdata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  project_j_pgdata:
  project_j_promdata:
  project_j_grafdata:
