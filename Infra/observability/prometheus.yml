global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "project_j_ue_servers"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "project_j_nakama"
    static_configs:
      - targets: ["nakama:9101"]

  - job_name: "project_j_postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "project_j_valkey"
    static_configs:
      - targets: ["valkey_exporter:9121"]
